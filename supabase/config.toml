project_id = "devcity"
[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000
[db]
port = 54322
major_version = 17
[auth]
enabled = true
site_url = "http://localhost:5173"
additional_redirect_urls = ["http://127.0.0.1:5173/cidade", "http://localhost:5173/cidade"]
[auth.external.github]
enabled = true
client_id = "env(GITHUB_CLIENT_ID)"
secret = "env(GITHUB_CLIENT_SECRET)"
[functions.sync-github]
verify_jwt = false
[functions.bootstrap]
verify_jwt = false
[functions.delete-account]
verify_jwt = false
